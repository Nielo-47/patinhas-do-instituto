name: Supabase Keep Alive
on:
  schedule:
    # Runs every day at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  ping:
    name: Ping Supabase
    runs-on: ubuntu-latest
    steps:
      - name: Send write query to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          # Make sure you add the Service Role Key to GitHub Secrets!
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          response=$(curl --silent --output /dev/null --write-out "%{http_code}" \
            --request POST \
            "${SUPABASE_URL}/rest/v1/keep_alive" \
            --header "apikey: ${SUPABASE_SERVICE_KEY}" \
            --header "Authorization: Bearer ${SUPABASE_SERVICE_KEY}" \
            --header "Content-Type: application/json" \
            --header "Prefer: return=minimal" \
            --data '{"pinged_at": "now()"}')

          echo "HTTP status: ${response}"

          if [[ "${response}" -lt 200 || "${response}" -ge 300 ]]; then
            echo "Supabase ping failed with status ${response}"
            exit 1
          fi

          echo "Supabase ping succeeded."
